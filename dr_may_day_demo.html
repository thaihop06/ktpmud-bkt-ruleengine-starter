        <button onclick="closeModal('modal-add-patient')" class="text-slate-400 hover:text-slate-700 text-lg leading-none">&times;</button>
      </div>
      <form onsubmit="handleAddPatient(event)" class="p-5 space-y-3.5 text-sm">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Họ và tên bệnh nhân *</label>
          <input id="new-pt-name" required type="text" placeholder="Ví dụ: Trần Thị Mai Anh" class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-rose-600" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Tuổi *</label>
            <input id="new-pt-age" required type="number" min="0" max="120" value="32" class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-rose-600" />

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Giới tính</label>
            <select id="new-pt-gender" class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-rose-600">
              <option value="Nữ">Nữ</option>
              <option value="Nam">Nam</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Chẩn đoán ban đầu *</label>
          <input id="new-pt-diag" required type="text" value="Mày đay mạn tính tự phát (CSU)" class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-rose-600" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Tiền sử dị ứng thuốc / thức ăn</label>

        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModal('modal-add-patient')" class="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs font-medium">Hủy</button>

        </div>
      </form>
    </div>

    function getSelectedPatient() {
      return state.patients.find(p => p.id === state.selectedPatientId) || state.patients[0];
    }

    function addAuditLog(action, status) {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const ts = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      state.auditLogs.unshift({
        time: ts,
        uuid: state.settings.roleMode === 'admin' ? 'a901c77d-11b4-4e89-8012-adm' : '8f14e45f-ea9b-4d12-9a21-001',
        action,
        status
      });
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const clockEl = document.getElementById('live-clock');
      if (clockEl) {
        clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    function uas7Badge(score) {
      if (score >= state.settings.uas7HighThreshold) {
        return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-rose-100 text-rose-800 border border-rose-200">Nặng (${score}/42)</span>`;
      }
      if (score >= 16) {
        return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800 border border-amber-200">Trung bình (${score}/42)</span>`;
      }
      if (score >= 7) {
        return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-sky-100 text-sky-800 border border-sky-200">Nhẹ (${score}/42)</span>`;
      }
      return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">Kiểm soát tốt (${score}/42)</span>`;
    }

    function anaphylaxisBadge(status) {
      if (status === 'SOC_PHAN_VE') {
        return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-red-700 text-white">Sốc phản vệ</span>`;
      }
      if (status === 'PHAN_VE') {
        return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-100 text-rose-800 border border-rose-300">Phản vệ</span>`;
      }
      return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-700 border border-slate-200">Theo dõi</span>`;
    }

    // ================= 3. BỆNH ÁN & SÀNG LỌC PHẢN VỆ =================
    function evaluateAnaphylaxisClinical(age, sbp, baseSbp, hasAllergen, isInhaled, skin, resp, circ, gi) {
      let tier2 = null;
      if (!hasAllergen && skin && (resp || circ)) {
        tier2 = 'R01-PV: Khởi phát cấp tính da/niêm mạc kèm suy hô hấp hoặc tụt huyết áp';
      } else if (hasAllergen && ([skin, resp, circ, gi].filter(Boolean).length >= 2)) {
        tier2 = 'R02-PV: Tiếp xúc dị nguyên nghi ngờ kèm tổn thương từ 2 cơ quan trở lên';
      } else if (hasAllergen && (((!isInhaled) && resp) || circ)) {
        tier2 = 'R03-PV: Tiếp xúc dị nguyên không qua đường hít kèm triệu chứng hô hấp hoặc tuần hoàn';
      }

      if (!tier2) {
        return {
          status: 'THEO_DOI',
          title: 'THEO DÕI LÂM SÀNG',
          rule: 'Chưa đủ tiêu chuẩn phản vệ',
          desc: 'Tiếp tục theo dõi mạch, huyết áp và diễn tiến sẩn phù tại phòng khám.'
        };
      }

      let shock = false;
      if (sbp !== null && !isNaN(sbp)) {
        if (age < 1) shock = sbp < 70;
        else if (age < 11) shock = sbp < (70 + 2 * age);
        else if (age < 18) shock = sbp < 90;
        else shock = (sbp < 90) || (baseSbp !== null && !isNaN(baseSbp) && baseSbp > 0 && (10 * sbp < 7 * baseSbp));
      }

      if (shock) {
        return {
          status: 'SOC_PHAN_VE',
          title: 'SỐC PHẢN VỆ (MỨC ĐỘ NGUY KỊCH)',
          rule: 'R-SOC: Đạt tiêu chuẩn phản vệ kèm tụt huyết áp theo ngưỡng tuổi / giảm > 30% HATT nền',
          desc: 'Cần kích hoạt quy trình xử trí cấp cứu phản vệ ngay lập tức tại cơ sở y tế.'
        };
      }

      return {
        status: 'PHAN_VE',
        title: 'PHẢN VỆ',
        rule: tier2,
        desc: 'Cần theo dõi sát sinh hiệu liên tục và xử trí theo phác đồ phản vệ của Bộ Y tế.'
      };
    }

    function previewAnaphylaxis() {

      const sbpRaw = document.getElementById('rec-sbp').value;
      const baseRaw = document.getElementById('rec-base-sbp').value;
      const sbp = sbpRaw === '' ? null : parseFloat(sbpRaw);
      const baseSbp = baseRaw === '' ? null : parseFloat(baseRaw);

      const res = evaluateAnaphylaxisClinical(
        age,
        sbp,
        baseSbp,
        document.getElementById('rec-allergen').checked,
        document.getElementById('rec-inhaled').checked,
        document.getElementById('rec-skin').checked,
        document.getElementById('rec-resp').checked,
        document.getElementById('rec-circ').checked,
        document.getElementById('rec-gi').checked
      );

      window._lastEval = res;
      const box = document.getElementById('rec-result-box');
      if (res.status === 'SOC_PHAN_VE') {
        box.className = 'p-4 rounded-xl border-2 border-red-600 bg-red-50 text-red-950 space-y-1';
      } else if (res.status === 'PHAN_VE') {
        box.className = 'p-4 rounded-xl border border-rose-300 bg-rose-50 text-rose-950 space-y-1';
      } else {
        box.className = 'p-4 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 space-y-1';
      }
      box.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wide">${res.title}</span>
          ${anaphylaxisBadge(res.status)}

    function exportReportCSV() {
      const headers = ['Ma_BN', 'Benh_Nhan', 'Tuoi', 'Gioi_Tinh', 'Chan_Doan', 'Diem_UAS7', 'Phan_Tang_Phan_Ve'];
      const rows = state.patients.map(p => [
        p.id,
        state.settings.anonymizeExport ? `Benh_Nhan_${p.id}` : p.name,
        p.age,
        p.gender,
        `"${p.diagnosis}"`,
        p.uas7,
        p.anaphylaxisStatus
      ].join(','));
      const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bao_cao_lam_sang_dr_mayday.csv';
      a.click();
      URL.revokeObjectURL(url);
      addAuditLog('Xuất báo cáo thống kê CSV', 'REPORT_EXPORTED');
      showToast('Đã tải xuống tệp bao_cao_lam_sang_dr_mayday.csv');
    }

    function saveSettings() {
      state.settings.clinicName = document.getElementById('set-clinic').value.trim() || 'Khoa Bệnh Mày Đay';
      state.settings.uas7HighThreshold = parseInt(document.getElementById('set-uas7').value, 10) || 28;
      state.settings.roleMode = document.getElementById('set-role').value;
      state.settings.allergyAlertEnabled = document.getElementById('set-allergy-alert').checked;
      state.settings.anonymizeExport = document.getElementById('set-anon').checked;

      document.getElementById('sidebar-clinic-name').textContent = state.settings.clinicName;
      const isAdmin = state.settings.roleMode === 'admin';
      const uName = isAdmin ? 'Quản trị viên' : 'BS. Nguyễn Minh Quân';
      const uRole = isAdmin ? 'Quản trị hệ thống' : 'Bác sĩ điều trị';
      const uShort = isAdmin ? 'ADM' : 'BS';

      document.getElementById('sidebar-user-name').textContent = uName;
      document.getElementById('sidebar-user-role').textContent = uRole;
      document.getElementById('sidebar-avatar').textContent = uShort;
      document.getElementById('sidebar-role-badge').textContent = uShort;
      document.getElementById('header-user-name').textContent = uName;
      document.getElementById('header-user-role').textContent = uRole;
      document.getElementById('header-avatar').textContent = uShort;

      addAuditLog('Cập nhật cấu hình hệ thống', 'SETTINGS_SAVED');
      showToast('Đã lưu cài đặt hệ thống.');
      renderSettings();
    }

    // Khởi chạy mặc định tại màn hình Tổng quan
    switchTab('overview');
  </script>
</body>
</html>
